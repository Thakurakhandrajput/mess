<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>No Internet - OBC Mess</title>
    
    <meta name="theme-color" content="#f4f6f9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <style>
        :root { --bg-color: #f4f6f9; --text-main: #1d1d1f; --text-muted: #86868b; --primary: #007AFF; --danger: #FF3B30; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent;}
        
        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 20px; 
        }

        /* Broken WiFi Icon Animation */
        .icon-wrapper { 
            width: 110px; 
            height: 110px; 
            background: rgba(255, 59, 48, 0.1); 
            color: var(--danger); 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin-bottom: 25px; 
            animation: pulse 2s infinite; 
            box-shadow: 0 0 0 10px rgba(255, 59, 48, 0.05);
        }
        
        @keyframes pulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.05); } 
            100% { transform: scale(1); } 
        }

        h1 { margin: 0 0 12px 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px;}
        p { margin: 0 0 35px 0; font-size: 15px; color: var(--text-muted); font-weight: 600; max-width: 280px; line-height: 1.5; }
        
        .btn-retry { 
            background: var(--primary); 
            color: #fff; 
            border: none; 
            padding: 18px 40px; 
            border-radius: 16px; 
            font-size: 16px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: 0.2s; 
            box-shadow: 0 8px 20px rgba(0,122,255,0.25); 
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-retry:active { transform: scale(0.95); box-shadow: 0 4px 10px rgba(0,122,255,0.15); }
    </style>
</head>
<body>

    <div class="icon-wrapper">
        <!-- SVG for Disconnected Wi-Fi -->
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
    </div>

    <h1>Connection Lost</h1>
    <p>You are currently offline. Please check your Wi-Fi or Mobile Data and try again.</p>
    
    <!-- Yeh button page ko wapas load karne ka try karega -->
    <button class="btn-retry" onclick="window.location.reload()">
        <span>🔄</span> Try Again
    </button>

</body>
</html>
