<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess Gate Entry</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        
        /* LOGIN SCREEN STYLES */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { background: #1a1c1e; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; width: 90%; max-width: 350px; }
        .login-box h2 { color: #fff; margin: 0 0 10px 0; }
        .login-box p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .login-box input { width: 100%; padding: 15px; border-radius: 12px; border: none; background: #2a2d31; color: #fff; margin-bottom: 20px; font-size: 18px; text-align: center; outline: none; letter-spacing: 3px; }
        .login-box input:focus { border: 2px solid #5cb85c; }
        .login-box button { width: 100%; background: #5cb85c; color: #fff; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .login-box button:active { transform: scale(0.95); background: #449d44; }

        /* MAIN APP (Hidden initially) */
        #main-app { display: none; width: 100%; display: flex; justify-content: center; }

        /* Main Keypad Card */
        .card { width: 100%; max-width: 360px; background: #1a1c1e; border-radius: 20px; padding: 30px 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 600; }
        .header p { margin: 5px 0 0 0; font-size: 14px; font-weight: bold; }
        
        #display { font-size: 32px; background: #2a2d31; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 25px; letter-spacing: 5px; font-weight: bold; height: 65px; display: flex; align-items: center; justify-content: center; }
        
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .btn { background: #32363b; color: #fff; font-size: 24px; font-weight: 500; padding: 18px; border: none; border-radius: 12px; cursor: pointer; transition: 0.1s; }
        .btn:active { background: #4a4f56; transform: scale(0.95); }
        
        .btn-clear { background: #d9534f; } 
        .btn-clear:active { background: #c9302c; }
        
        .btn-enter { background: #5cb85c; } 
        .btn-enter:active { background: #449d44; }

        /* POPUP OVERLAY */
        #popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        
        .popup-box { width: 100%; max-width: 350px; background: #1e2227; border-radius: 20px; padding: 25px; text-align: center; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.9); animation: popIn 0.3s ease-out; border: 1px solid #333; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .popup-avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; margin-bottom: 15px; background: #333; }
        .popup-name { font-size: 22px; margin: 0 0 5px 0; color: #fff; font-weight: bold; }
        .popup-room { font-size: 16px; color: #bbb; margin: 0 0 15px 0; }
        
        .status-badge { display: inline-block; padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; }
        .bg-active { background: rgba(76, 175, 80, 0.2); color: #4caf50; border: 1px solid #4caf50; }
        .bg-due { background: rgba(255, 152, 0, 0.2); color: #ff9800; border: 1px solid #ff9800; }
        .bg-banned { background: rgba(244, 67, 54, 0.2); color: #f44336; border: 1px solid #f44336; }

        #popup-action-area { margin-top: 20px; border-top: 1px solid #333; padding-top: 20px; }
        
        .btn-verify-now { width: 100%; background: #4caf50; color: #fff; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4); }
        .btn-verify-now:active { transform: scale(0.97); }
        
        .msg-already { background: rgba(244, 67, 54, 0.1); color: #f44336; border: 2px dashed #f44336; padding: 12px; border-radius: 12px; font-size: 18px; font-weight: bold; letter-spacing: 1px; }
        
        .msg-success { background: rgba(76, 175, 80, 0.1); color: #4caf50; border: 2px solid #4caf50; padding: 12px; border-radius: 12px; font-size: 18px; font-weight: bold; letter-spacing: 1px; }
        
        .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: #888; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-overlay">
    <div class="login-box">
        <h2>Gate Security</h2>
        <p>Enter Master Password</p>
        <input type="password" id="gate-pass" placeholder="••••••••">
        <button onclick="verifyLogin()">Unlock Terminal</button>
    </div>
</div>

<!-- MAIN APP (Locked Initially) -->
<div id="main-app" style="display: none;">
    <div class="card">
        <div class="header">
            <h1>Mess Gate Entry</h1>
            <p id="session-display" style="color: #aaa;">Checking Time...</p>
        </div>

        <div id="display">-</div>

        <div class="keypad">
            <button class="btn" onclick="press(1)">1</button>
            <button class="btn" onclick="press(2)">2</button>
            <button class="btn" onclick="press(3)">3</button>
            
            <button class="btn" onclick="press(4)">4</button>
            <button class="btn" onclick="press(5)">5</button>
            <button class="btn" onclick="press(6)">6</button>
            
            <button class="btn" onclick="press(7)">7</button>
            <button class="btn" onclick="press(8)">8</button>
            <button class="btn" onclick="press(9)">9</button>
            
            <button class="btn btn-clear" onclick="clearInput()">C</button>
            <button class="btn" onclick="press(0)">0</button>
            <button class="btn btn-enter" onclick="checkStudent()">✔</button>
        </div>
    </div>
</div>

<!-- POPUP OVERLAY -->
<div id="popup-overlay">
    <div class="popup-box">
        <button class="close-btn" onclick="closePopup()">✖</button>
        
        <img id="pop-photo" class="popup-avatar" src="https://via.placeholder.com/150" alt="Photo">
        <h2 id="pop-name" class="popup-name">Loading...</h2>
        <p id="pop-room" class="popup-room">Room: - | Code: -</p>
        
        <div id="pop-status" class="status-badge bg-active">Active</div>
        <div style="font-size:12px; color:#aaa; margin-bottom:5px;">Fee Valid Till: <b id="pop-fee" style="color:#fff;">-</b></div>
        <div style="font-size:12px; color:#aaa; font-weight:bold; color:#2196f3;" id="pop-session">Session</div>

        <div id="popup-action-area"></div>
    </div>
</div>

<script>
    // --- 1. SECURITY LOGIC ---
    function securePass(p) { return btoa(btoa(p)); }
    
    window.onload = () => {
        if(sessionStorage.getItem("gate_auth") === "unlocked") {
            grantAccess();
        }
    }

    function verifyLogin() {
        let input = document.getElementById("gate-pass").value;
        // Hash for "Admin@123"
        if(securePass(input) === 'UVdSdGFXNUFNVEl6') {
            sessionStorage.setItem("gate_auth", "unlocked");
            grantAccess();
        } else {
            alert("❌ Incorrect Password!");
            document.getElementById("gate-pass").value = "";
        }
    }

    function grantAccess() {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("main-app").style.display = "flex";
        startFirebaseSystem();
    }

    // --- 2. FIREBASE & CORE SYSTEM ---
    let db;
    let inputCode = "";
    let globalStudentData = null; 

    function startFirebaseSystem() {
        const firebaseConfig = {
          apiKey: "AIzaSyAA2P2IM5aPzJj10XMGLn_9BMSJhKeMGiE",
          authDomain: "mess-system.firebaseapp.com",
          projectId: "mess-system",
          storageBucket: "mess-system.firebasestorage.app",
          messagingSenderId: "501219370424",
          appId: "1:501219370424:web:1dddaefc10e8bd21efdb4d"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
    }

    // 🔥 STRICT TIME SLOTS LOGIC
    function getMealSession() {
        const h = new Date().getHours();
        if (h >= 7 && h < 10) return "Breakfast"; // 7:00 AM to 9:59 AM
        if (h >= 13 && h < 16) return "Lunch";    // 1:00 PM to 3:59 PM
        if (h >= 19 && h < 22) return "Dinner";   // 7:00 PM to 9:59 PM
        return "Closed";
    }

    // Live Header Update
    setInterval(() => {
        const session = getMealSession();
        const display = document.getElementById("session-display");
        if(session === "Closed") {
            display.innerHTML = "⛔ MESS CLOSED";
            display.style.color = "#d9534f";
        } else {
            display.innerHTML = "✅ " + session.toUpperCase() + " SESSION ON";
            display.style.color = "#5cb85c";
        }
    }, 1000);

    // Keypad Logic
    function press(n) {
        if(inputCode.length < 5) { 
            if(inputCode === "") document.getElementById('display').innerText = "";
            inputCode += n;
            document.getElementById('display').innerText = inputCode;
        }
    }

    function clearInput() {
        inputCode = "";
        document.getElementById('display').innerText = "-";
    }
    
    function closePopup() {
        document.getElementById('popup-overlay').style.display = "none";
        clearInput();
    }

    async function checkStudent() {
        // 🔥 TIME CHECK OVERRIDE
        const meal = getMealSession();
        if(meal === "Closed") {
            playAudio(false);
            alert("⛔ MESS IS CURRENTLY CLOSED!");
            clearInput();
            return;
        }

        if(!inputCode) return;
        const code = inputCode;
        
        document.getElementById('display').innerText = "WAIT...";

        try {
            const studentDoc = await db.collection("students").doc(code).get();

            if(!studentDoc.exists) {
                playAudio(false);
                alert("❌ INVALID CODE! Student not found.");
                clearInput();
                return;
            }

            const data = studentDoc.data();
            globalStudentData = data; 
            
            const todayStr = new Date().toISOString().split('T')[0];
            const logId = `${code}_${todayStr}_${meal}`;

            // Populate Popup Details
            document.getElementById('pop-photo').src = data.photo;
            document.getElementById('pop-name').innerText = data.name;
            document.getElementById('pop-room').innerText = `Room: ${data.room} | Code: ${data.code}`;
            document.getElementById('pop-fee').innerText = data.feeValidTill;
            document.getElementById('pop-session').innerText = `${meal.toUpperCase()} ENTRY`;

            // Status Badge Logic
            const statusBadge = document.getElementById('pop-status');
            if(data.status === 'active') { statusBadge.className = 'status-badge bg-active'; statusBadge.innerText = "ACTIVE"; }
            else if(data.status === 'fee_due') { statusBadge.className = 'status-badge bg-due'; statusBadge.innerText = "FEE DUE"; }
            else { statusBadge.className = 'status-badge bg-banned'; statusBadge.innerText = "BANNED"; }

            const actionArea = document.getElementById('popup-action-area');
            actionArea.innerHTML = "Checking...";

            // Check if Already Eaten
            const logDoc = await db.collection("attendance").doc(logId).get();

            if(logDoc.exists) {
                actionArea.innerHTML = `<div class="msg-already">❌ ALREADY EATEN!</div>`;
                playAudio(false);
            } 
            else if(data.status === 'banned') {
                actionArea.innerHTML = `<div class="msg-already">⛔ BANNED BY ADMIN</div>`;
                playAudio(false);
            }
            else {
                actionArea.innerHTML = `<button class="btn-verify-now" onclick="markEntry('${logId}', '${meal}')">VERIFY & ALLOW</button>`;
                playAudio(true, 400); 
            }

            document.getElementById('popup-overlay').style.display = "flex";

        } catch (err) {
            console.error(err);
            alert("Database Error! Check internet connection.");
            clearInput();
        }
    }

    async function markEntry(logId, meal) {
        const btn = document.querySelector('.btn-verify-now');
        btn.innerText = "SAVING...";
        btn.style.opacity = "0.7";

        try {
            await db.collection("attendance").doc(logId).set({
                code: globalStudentData.code,
                name: globalStudentData.name,
                room: globalStudentData.room,
                meal: meal,
                date: new Date().toISOString().split('T')[0],
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            const actionArea = document.getElementById('popup-action-area');
            actionArea.innerHTML = `<div class="msg-success">✅ VERIFIED! GO INSIDE</div>`;
            playAudio(true, 800);

            setTimeout(() => { closePopup(); }, 1500);

        } catch(err) {
            alert("Failed to save entry!");
            btn.innerText = "TRY AGAIN";
        }
    }

    function playAudio(isSuccess, freq = 800) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = isSuccess ? "sine" : "square";
        osc.frequency.value = isSuccess ? freq : 150;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => osc.stop(), isSuccess ? 200 : 500);
    }
</script>

</body>
</html>
