<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mess Gate Entry & Scanner</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <!-- 🔥 HTML5 QR CODE SCANNER SDK 🔥 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body { background: #121212; color: #fff; margin: 0; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; overflow: hidden; height: 100dvh; }
        
        /* OVERLAYS (Admin Login & PIN Login) */
        .overlay-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 99999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        
        .login-box { background: #1a1c1e; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; width: 90%; max-width: 350px; border: 1px solid #2a2d31; }
        .login-box h2 { color: #fff; margin: 0 0 10px 0; font-size: 24px; }
        .login-box p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .login-box input { width: 100%; padding: 15px; border-radius: 12px; border: none; background: #2a2d31; color: #fff; margin-bottom: 20px; font-size: 18px; text-align: center; outline: none; letter-spacing: 2px; }
        .login-box input:focus { border: 2px solid #5cb85c; }
        .login-box button { width: 100%; background: #5cb85c; color: #fff; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(92, 184, 92, 0.3); }
        .login-box button:active { transform: scale(0.95); background: #449d44; }

        /* MAIN APP CONTAINER */
        #main-app { width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; overflow: hidden; }

        .card { width: 100%; max-width: 360px; height: 100%; display: flex; flex-direction: column; background: #1a1c1e; border-radius: 20px; padding: 12px 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #2a2d31; overflow: hidden; }
        .header { text-align: center; margin-bottom: 8px; flex: 0 0 auto; }
        .header h1 { margin: 0; font-size: 17px; font-weight: 600; color: #fff; }
        #session-display { margin: 3px 0 0 0; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        /* 🔥 LIVE SCANNER BOX — capped height so it never pushes the keypad off-screen 🔥 */
        #reader-wrap { position: relative; flex: 0 0 auto; width: 100%; height: 34vh; max-height: 190px; min-height: 130px; border-radius: 14px; overflow: hidden; background: #000; border: 2px solid #32363b; margin-bottom: 10px; }
        #reader { width: 100%; height: 100%; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; border-radius: 0 !important; }
        #reader img { display: none !important; } /* hide default html5-qrcode camera-permission image */

        #reader-placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; color: #777; font-size: 13px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; gap: 6px; }
        #reader-placeholder .icon { font-size: 28px; }

        #scanner-toggle-btn { position: absolute; top: 8px; right: 8px; z-index: 20; background: rgba(0,0,0,0.55); backdrop-filter: blur(6px); color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        #scanner-toggle-btn.is-off { background: rgba(92,184,92,0.85); border-color: #5cb85c; }
        #scanner-toggle-btn.is-on { background: rgba(217,83,79,0.85); border-color: #d9534f; }

        #display { flex: 0 0 auto; font-size: 22px; background: #2a2d31; color: #fff; padding: 8px; border-radius: 12px; text-align: center; margin-bottom: 10px; letter-spacing: 4px; font-weight: bold; height: 42px; display: flex; align-items: center; justify-content: center; }
        
        .keypad { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 8px; min-height: 0; }
        .btn { background: #32363b; color: #fff; font-size: clamp(18px, 6vh, 26px); font-weight: 500; border: none; border-radius: 12px; cursor: pointer; transition: 0.1s; }
        .btn:active { background: #4a4f56; transform: scale(0.95); }
        .btn-clear { background: #d9534f; } .btn-clear:active { background: #c9302c; }
        .btn-enter { background: #5cb85c; } .btn-enter:active { background: #449d44; }

        /* POPUP OVERLAY (Details) */
        #popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .popup-box { width: 100%; max-width: 350px; background: #1e2227; border-radius: 24px; padding: 25px; text-align: center; position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.9); animation: popIn 0.3s ease-out; border: 1px solid #333; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        .popup-avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; margin-bottom: 15px; background: #333; }
        .popup-name { font-size: 22px; margin: 0 0 5px 0; color: #fff; font-weight: bold; }
        .popup-room { font-size: 16px; color: #bbb; margin: 0 0 15px 0; }
        
        .status-badge { display: inline-block; padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; }
        .bg-active { background: rgba(76, 175, 80, 0.2); color: #4caf50; border: 1px solid #4caf50; }
        .bg-due { background: rgba(255, 152, 0, 0.2); color: #ff9800; border: 1px solid #ff9800; }
        .bg-banned { background: rgba(244, 67, 54, 0.2); color: #f44336; border: 1px solid #f4f6f9; }
        .bg-pause { background: rgba(0, 122, 255, 0.2); color: #007AFF; border: 1px solid #007AFF; }

        #popup-action-area { margin-top: 20px; border-top: 1px solid #333; padding-top: 20px; }
        .btn-verify-now { width: 100%; background: #4caf50; color: #fff; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .btn-verify-due { width: 100%; background: transparent; color: #ff9800; border: 2px solid #ff9800; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; margin-top: 10px; }
        .msg-already { background: rgba(244, 67, 54, 0.1); color: #f4f6f9; border: 2px dashed #f4f6f9; padding: 12px; border-radius: 12px; font-size: 18px; font-weight: bold; letter-spacing: 1px; }
        .msg-success { background: rgba(76, 175, 80, 0.1); color: #4caf50; border: 2px solid #4caf50; padding: 12px; border-radius: 12px; font-size: 18px; font-weight: bold; letter-spacing: 1px; }
        .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: #888; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

<!-- 1. ADMIN AUTH OVERLAY -->
<div id="firebase-login-overlay" class="overlay-screen">
    <div class="login-box">
        <h2>Device Setup</h2>
        <p style="color:#ff9800;">Admin Auth required once for this terminal.</p>
        <input type="email" id="admin-email" placeholder="Admin Email">
        <input type="password" id="admin-pass" placeholder="Admin Password">
        <button id="btn-auth" onclick="authorizeDevice()">Authorize Device</button>
    </div>
</div>

<!-- 2. GATE PIN OVERLAY -->
<div id="pin-login-overlay" class="overlay-screen">
    <div class="login-box">
        <h2>Gate Security</h2>
        <p>Enter Master Gate PIN</p>
        <input type="password" id="gate-pin" placeholder="••••••••" style="letter-spacing: 5px;">
        <button id="btn-unlock" onclick="verifyPin()">Unlock Terminal</button>
    </div>
</div>

<!-- 3. MAIN TERMINAL -->
<div id="main-app">
    <div class="card">
        <div class="header">
            <h1>Mess Gate Entry</h1>
            <p id="session-display" style="color: #d9534f;">⏳ Checking Time...</p>
        </div>
        
        <!-- 🔥 QR SCANNER VIEWPORT 🔥 -->
        <div id="reader-wrap">
            <div id="reader"></div>
            <div id="reader-placeholder"><div class="icon">📷</div><div>Camera Off</div></div>
            <button id="scanner-toggle-btn" class="is-on" onclick="toggleScanner()">⏸ Stop Cam</button>
        </div>

        <div id="display">-</div>
        
        <div class="keypad">
            <button class="btn" onclick="press(1)">1</button><button class="btn" onclick="press(2)">2</button><button class="btn" onclick="press(3)">3</button>
            <button class="btn" onclick="press(4)">4</button><button class="btn" onclick="press(5)">5</button><button class="btn" onclick="press(6)">6</button>
            <button class="btn" onclick="press(7)">7</button><button class="btn" onclick="press(8)">8</button><button class="btn" onclick="press(9)">9</button>
            <button class="btn btn-clear" onclick="clearInput()">C</button><button class="btn" onclick="press(0)">0</button><button class="btn btn-enter" onclick="checkStudent(inputCode)">✔</button>
        </div>
    </div>
</div>

<!-- POPUP OVERLAY -->
<div id="popup-overlay">
    <div class="popup-box">
        <button class="close-btn" onclick="closePopup()">✖</button>
        <img id="pop-photo" class="popup-avatar" src="" alt="Photo">
        <h2 id="pop-name" class="popup-name">Loading...</h2>
        <p id="pop-room" class="popup-room">Room: - | Code: -</p>
        <div id="pop-status" class="status-badge bg-active">Active</div>
        <div style="font-size:12px; color:#aaa; margin-bottom:5px;">Fee Valid Till: <b id="pop-fee" style="color:#fff;">-</b></div>
        <div style="font-size:12px; font-weight:bold; color:#2196f3;" id="pop-session">Session</div>
        <div id="popup-action-area"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAA2P2IM5aPzJj10XMGLn_9BMSJhKeMGiE",
      authDomain: "obc-mess-system.firebaseapp.com",
      projectId: "obc-mess-system",
      storageBucket: "obc-mess-system.firebasestorage.app",
      messagingSenderId: "501219370424",
      appId: "1:501219370424:web:1dddaefc10e8bd21efdb4d"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let inputCode = "";
    let globalStudentData = null; 
    let messTimings = { bStart: 8, bEnd: 10, lStart: 13, lEnd: 15, dStart: 20, dEnd: 22 };
    let liveMasterPin = "Admin@123";
    let html5QrCode = null;
    let isScanningActive = false;
    let isCameraStarted = false; // true once the camera stream itself is running (vs just paused)

    // --- SECURITY ROUTING ---
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            document.getElementById("firebase-login-overlay").style.display = "none";
            await loadGateConfig();
            
            if(sessionStorage.getItem("gate_unlocked") === "true") {
                document.getElementById("pin-login-overlay").style.display = "none";
                document.getElementById("main-app").style.display = "flex";
                startScanner(); // 🔥 Start camera scanner
            } else {
                document.getElementById("pin-login-overlay").style.display = "flex";
                document.getElementById("main-app").style.display = "none";
            }
        } else {
            document.getElementById("firebase-login-overlay").style.display = "flex";
            document.getElementById("pin-login-overlay").style.display = "none";
            document.getElementById("main-app").style.display = "none";
        }
    });

    function authorizeDevice() {
        let e = document.getElementById("admin-email").value;
        let p = document.getElementById("admin-pass").value;
        let btn = document.getElementById("btn-auth");
        if(!e || !p) return alert("Please enter details.");
        
        btn.innerText = "Authorizing...";
        auth.signInWithEmailAndPassword(e, p).catch(err => {
            alert("❌ Auth Failed: " + err.message);
            btn.innerText = "Authorize Device";
        });
    }

    async function loadGateConfig() {
        try {
            const tDoc = await db.collection("config").doc("timings").get();
            if(tDoc.exists) messTimings = tDoc.data();
            const pDoc = await db.collection("config").doc("gate_security").get();
            if(pDoc.exists && pDoc.data().pin) liveMasterPin = pDoc.data().pin;
        } catch(e) { console.error("Config load error:", e); }
    }

    function verifyPin() {
        let input = document.getElementById("gate-pin").value.trim();
        if(input === liveMasterPin) {
            sessionStorage.setItem("gate_unlocked", "true");
            document.getElementById("pin-login-overlay").style.display = "none";
            document.getElementById("main-app").style.display = "flex";
            startScanner(); // 🔥 Start camera scanner after PIN unlock
        } else {
            alert("❌ Incorrect PIN!");
            document.getElementById("gate-pin").value = "";
        }
    }

    // --- 🔥 QR CAMERA SCANNER INITIALIZATION 🔥 ---
    function startScanner() {
        if (isCameraStarted) return;

        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 15, qrbox: { width: 190, height: 190 } };

        html5QrCode.start(
            { facingMode: "environment" }, 
            config, 
            (decodedText) => {
                // Successfully scanned QR Code text (ye bacche ka code hoga jaise "101")
                let scannedCode = decodedText.trim();
                if(scannedCode && scannedCode.length <= 6) {
                    inputCode = scannedCode;
                    document.getElementById('display').innerText = inputCode;
                    
                    // Pauses scanner temporarily to avoid duplicate triggers
                    if(isScanningActive) {
                        html5QrCode.pause();
                        isScanningActive = false;
                    }

                    checkStudent(inputCode, true); // true = came from QR scan
                }
            },
            (errorMessage) => {
                // Scanning frame by frame (ignore errors)
            }
        ).then(() => {
            isScanningActive = true;
            isCameraStarted = true;
            setToggleButtonState(true);
        }).catch(err => {
            console.error("Camera start failed:", err);
        });
    }

    // Fully releases the camera stream (removes the OS "camera in use" indicator too)
    function stopScannerFully() {
        if (html5QrCode && isCameraStarted) {
            html5QrCode.stop().then(() => {
                isScanningActive = false;
                isCameraStarted = false;
                setToggleButtonState(false);
            }).catch(err => console.error("Stop failed", err));
        }
    }

    function toggleScanner() {
        if (isCameraStarted) {
            stopScannerFully();
        } else {
            startScanner();
        }
    }

    function setToggleButtonState(isOn) {
        const btn = document.getElementById('scanner-toggle-btn');
        const placeholder = document.getElementById('reader-placeholder');
        if (isOn) {
            btn.innerText = "⏸ Stop Cam";
            btn.classList.remove('is-off'); btn.classList.add('is-on');
            placeholder.style.display = 'none';
        } else {
            btn.innerText = "▶ Start Cam";
            btn.classList.remove('is-on'); btn.classList.add('is-off');
            placeholder.style.display = 'flex';
        }
    }

    function getMealSession() {
        const h = new Date().getHours();
        if (h >= messTimings.bStart && h < messTimings.bEnd) return "Breakfast";
        if (h >= messTimings.lStart && h < messTimings.lEnd) return "Lunch";
        if (h >= messTimings.dStart && h < messTimings.dEnd) return "Dinner";
        return "Closed";
    }

    setInterval(() => {
        const session = getMealSession();
        const display = document.getElementById("session-display");
        if(session === "Closed") { display.innerText = "⛔ MESS CLOSED"; display.style.color = "#d9534f"; } 
        else { display.innerText = "✅ " + session.toUpperCase() + " SESSION ON"; display.style.color = "#5cb85c"; }
    }, 1000);

    // Keypad Logic
    function press(n) { if(inputCode.length < 5) { if(inputCode === "") document.getElementById('display').innerText = ""; inputCode += n; document.getElementById('display').innerText = inputCode; } }
    function clearInput() { inputCode = ""; document.getElementById('display').innerText = "-"; }
    
    function closePopup() { 
        document.getElementById('popup-overlay').style.display = "none"; 
        clearInput(); 
        // Resume camera scanner when popup closes (only if the camera is meant to be on)
        if (html5QrCode && isCameraStarted && !isScanningActive) {
            html5QrCode.resume();
            isScanningActive = true;
        }
    }

    function getDaysLeft(dateStr) {
        let today = new Date(); today.setHours(0,0,0,0);
        let target = new Date(dateStr);
        return Math.ceil((target - target.getTimezoneOffset()*60000 - today) / (1000 * 60 * 60 * 24));
    }

    // Terminal Checking & Verification
    async function checkStudent(codeToVerify, fromScan = false) {
        const meal = getMealSession();
        if(meal === "Closed") { 
            playAudio(false); 
            alert("⛔ MESS IS CURRENTLY CLOSED!"); 
            closePopup();
            return; 
        }
        if(!codeToVerify) return;
        
        const code = codeToVerify;
        document.getElementById('display').innerText = "CHECK...";

        try {
            const studentDoc = await db.collection("students").doc(code).get();

            if(!studentDoc.exists) { 
                playAudio(false); 
                alert(`❌ INVALID CODE (${code})! Student not found.`); 
                closePopup();
                return; 
            }

            let data = studentDoc.data();
            globalStudentData = data; 
            const todayStr = new Date().toISOString().split('T')[0];
            const logId = `${code}_${todayStr}_${meal}`;

            if(data.status === 'paused') {
                let pDate = new Date(data.lastPauseDate), tDate = new Date(todayStr);
                let daysPaused = Math.floor((tDate - pDate)/(1000*60*60*24));
                if(daysPaused < 0) daysPaused = 0;
                let newExp = new Date(data.feeValidTill); newExp.setDate(newExp.getDate() + daysPaused);
                let hist = data.pauseHistory || []; hist.push({start: data.lastPauseDate, end: todayStr});

                await db.collection("students").doc(code).update({ status: 'active', lastPauseDate: null, pauseHistory: hist, feeValidTill: newExp.toISOString().split('T')[0] });
                data.status = 'active'; data.feeValidTill = newExp.toISOString().split('T')[0];
            }

            let daysLeft = getDaysLeft(data.feeValidTill);
            if(daysLeft < 0 && data.status === 'active') {
                await db.collection("students").doc(code).update({status: 'fee_due'});
                data.status = 'fee_due';
            }

            document.getElementById('pop-photo').src = data.photo; 
            document.getElementById('pop-name').innerText = data.name;
            document.getElementById('pop-room').innerText = `Room: ${data.room} | Code: ${data.code}`;
            document.getElementById('pop-fee').innerText = data.feeValidTill; 
            document.getElementById('pop-session').innerText = `${meal.toUpperCase()} ENTRY`;

            const statusBadge = document.getElementById('pop-status');
            if(data.status === 'active') { statusBadge.className = 'status-badge bg-active'; statusBadge.innerText = "ACTIVE"; }
            else if(data.status === 'fee_due') { statusBadge.className = 'status-badge bg-due'; statusBadge.innerText = "FEE DUE"; }
            else if(data.status === 'paused') { statusBadge.className = 'status-badge bg-pause'; statusBadge.innerText = "PAUSED"; }
            else { statusBadge.className = 'status-badge bg-banned'; statusBadge.innerText = "BANNED"; }

            const actionArea = document.getElementById('popup-action-area'); 
            actionArea.innerHTML = "Checking log...";
            document.getElementById('popup-overlay').style.display = "flex";
            
            const logDoc = await db.collection("attendance").doc(logId).get();

            if(logDoc.exists) { 
                actionArea.innerHTML = `<div class="msg-already">❌ ALREADY EATEN!</div>`; 
                playAudio(false); 
            } 
            else if(data.status === 'banned') { 
                actionArea.innerHTML = `<div class="msg-already">⛔ BANNED BY ADMIN</div>`; 
                playAudio(false); 
            }
            else if(data.status === 'fee_due') { 
                // Fee-due is a judgment call for the gate staff, so this still needs a tap
                actionArea.innerHTML = `<div style="color:#ff9800; font-weight:bold; margin-bottom:10px;">⚠️ FEE EXPIRED!</div><button class="btn-verify-due" onclick="markEntry('${logId}', '${meal}', true)">ALLOW ANYWAY (DUE)</button>`; 
                playAudio(false); 
            }
            else if (fromScan) { 
                // 🔥 AUTO-VERIFY: only for QR scans — student is active & hasn't eaten, mark entry immediately, no tap needed
                actionArea.innerHTML = `<div class="msg-success">⏳ VERIFYING...</div>`; 
                playAudio(true, 400); 
                markEntry(logId, meal, false);
            }
            else {
                // Manual keypad entry — still requires the staff to tap Verify & Allow
                actionArea.innerHTML = `<button class="btn-verify-now" onclick="markEntry('${logId}', '${meal}', false)">VERIFY & ALLOW</button>`; 
                playAudio(true, 400); 
            }

        } catch (err) {
            console.error(err);
            alert("Database Error! Check connection.");
            closePopup();
        }
    }

    async function markEntry(logId, meal, isDueRecord) {
        const actionArea = document.getElementById('popup-action-area'); 
        actionArea.innerHTML = `<div class="msg-success">SAVING...</div>`;
        try {
            await db.collection("attendance").doc(logId).set({ 
                code: globalStudentData.code, 
                name: globalStudentData.name, 
                room: globalStudentData.room, 
                meal: meal, 
                date: new Date().toISOString().split('T')[0], 
                isDue: isDueRecord, 
                timestamp: firebase.firestore.FieldValue.serverTimestamp() 
            });
            
            actionArea.innerHTML = `<div class="msg-success">✅ ${isDueRecord ? 'ALLOWED ON DUE' : 'VERIFIED! GO INSIDE'}</div>`;
            playAudio(true, 800); 
            
            setTimeout(() => { 
                closePopup(); 
            }, 1200);
            
        } catch(err) { 
            alert("Failed to save entry!"); 
        }
    }

    function playAudio(isSuccess, freq = 800) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = isSuccess ? "sine" : "square"; osc.frequency.value = isSuccess ? freq : 150;
            osc.connect(gain); gain.connect(ctx.destination); osc.start();
            setTimeout(() => osc.stop(), isSuccess ? 200 : 500);
        } catch(e) {}
    }
</script>

</body>
</html>
